version: "3.8"

services:
  mysql:
    image: mysql:8.0
    restart: always
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: cs2_competition
      MYSQL_USER: cs2_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cs2_pass123456}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: always
    logging: *bounded-logs
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads   # 上传的截图持久化，容器重建不丢失
      - chat_maintenance:/app/chat-maintenance # 删除清单独立于 MySQL 备份恢复
    environment:
      DATABASE_URL: mysql+pymysql://cs2_user:${MYSQL_PASSWORD:-cs2_pass123456}@mysql:3306/cs2_competition?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-please-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-please-change-me}
      DB_ECHO: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      WX_MOCK_LOGIN: ${WX_MOCK_LOGIN:-false}
      WX_SUBSCRIBE_ENABLED: ${WX_SUBSCRIBE_ENABLED:-false}
      WX_SUBSCRIBE_TEMPLATES: ${WX_SUBSCRIBE_TEMPLATES:-}
      WX_SUBSCRIBE_ENV: ${WX_SUBSCRIBE_ENV:-formal}
      AI_REVIEW_ENABLED: ${AI_REVIEW_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      AI_MODEL: ${AI_MODEL:-GLM-5V-Turbo}
      CHAT_ENABLED: ${CHAT_ENABLED:-false}
      CHAT_WRITE_ENABLED: ${CHAT_WRITE_ENABLED:-false}
      CHAT_ALLOW_USERS: ${CHAT_ALLOW_USERS:-}
      CHAT_MODERATION_ENABLED: ${CHAT_MODERATION_ENABLED:-true}
      CHAT_DELETION_LEDGER: /app/chat-maintenance/deletions.jsonl
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ASSISTANT_EXTERNAL_ENABLED: ${ASSISTANT_EXTERNAL_ENABLED:-false}
      ASSISTANT_TOOL_MODEL_VERIFIED: ${ASSISTANT_TOOL_MODEL_VERIFIED:-false}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-glm-5.3-flash}
      ASSISTANT_ENGINE: ${ASSISTANT_ENGINE:-langchain}
      ASSISTANT_TIMEOUT_SECONDS: ${ASSISTANT_TIMEOUT_SECONDS:-60}
      ASSISTANT_MAX_STEPS: ${ASSISTANT_MAX_STEPS:-6}
      ASSISTANT_MAX_TOOL_CALLS: ${ASSISTANT_MAX_TOOL_CALLS:-8}
      ASSISTANT_SUMMARY_ENABLED: ${ASSISTANT_SUMMARY_ENABLED:-false}
      ASSISTANT_SUMMARY_TRIGGER_BYTES: ${ASSISTANT_SUMMARY_TRIGGER_BYTES:-20000}
      ASSISTANT_SUMMARY_KEEP_TURNS: ${ASSISTANT_SUMMARY_KEEP_TURNS:-6}
      ASSISTANT_HISTORY_BUDGET_BYTES: ${ASSISTANT_HISTORY_BUDGET_BYTES:-50000}
      ASSISTANT_SUMMARY_MAX_BYTES: ${ASSISTANT_SUMMARY_MAX_BYTES:-4000}
      ASSISTANT_SUMMARY_INPUT_MAX_BYTES: ${ASSISTANT_SUMMARY_INPUT_MAX_BYTES:-50000}
      ASSISTANT_SUMMARY_TIMEOUT_SECONDS: ${ASSISTANT_SUMMARY_TIMEOUT_SECONDS:-8}
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: always
    logging: *bounded-logs
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:   # 上传文件存储卷
  chat_maintenance: # 恢复数据库时保留此卷及最新异机副本，不能回退到旧清单
