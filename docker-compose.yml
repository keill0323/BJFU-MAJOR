version: "3.8"

services:
  mysql:
    image: mysql:8.0
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: cs2_competition
      MYSQL_USER: cs2_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cs2_pass123456}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads   # 上传的截图持久化，容器重建不丢失
    environment:
      DATABASE_URL: mysql+pymysql://cs2_user:${MYSQL_PASSWORD:-cs2_pass123456}@mysql:3306/cs2_competition?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-please-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-please-change-me}
      DB_ECHO: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      WX_MOCK_LOGIN: ${WX_MOCK_LOGIN:-false}
      AI_REVIEW_ENABLED: ${AI_REVIEW_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      AI_MODEL: ${AI_MODEL:-GLM-5V-Turbo}
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:   # 上传文件存储卷
