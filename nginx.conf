# Nginx 反代配置（HTTP + HTTPS）
# 用法：把 server_name 换成你的域名，证书用 certbot 生成后放 ./certbot/conf

events {}

http {
    upstream backend {
        server backend:8000;
    }

    # ---------- HTTP → HTTPS 跳转 ----------
    server {
        listen 80;
        server_name cs2.example.com;   # ← 改成你的域名
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- HTTPS ----------
    server {
        listen 443 ssl;
        server_name cs2.example.com;   # ← 改成你的域名

        ssl_certificate     /etc/letsencrypt/live/cs2.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cs2.example.com/privkey.pem;

        client_max_body_size 10m;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
