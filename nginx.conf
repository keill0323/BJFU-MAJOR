# Nginx 反代配置（正式 HTTPS 版）
# 证书由 certbot 自动管理，路径 /etc/letsencrypt/live/bjfumajor.com/

events {}

http {
    upstream backend {
        server backend:8000;
    }

    # ---------- HTTP：用于 ACME 验证 + 跳转 HTTPS ----------
    server {
        listen 80;
        server_name bjfumajor.com www.bjfumajor.com;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- HTTPS ----------
    server {
        listen 443 ssl;
        server_name bjfumajor.com www.bjfumajor.com;

        ssl_certificate     /etc/letsencrypt/live/bjfumajor.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bjfumajor.com/privkey.pem;

        client_max_body_size 10m;

        # 票据放在首帧；此接口只传实时更新提示，不传聊天正文。
        location = /api/chat/ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_send_timeout 15s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
